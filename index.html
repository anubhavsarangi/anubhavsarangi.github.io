---
layout: default
title: Home
---
<section class="hero">
  <h1>Notes, mostly.</h1>
  <p class="hero-copy">On software, data, AI, travel, and things I would like to remember.</p>
  <div class="hero-links">
    <a class="text-link" href="{{ '/writing/' | relative_url }}">Browse the notebook <span>→</span></a>
  </div>
</section>

<section class="recent" aria-labelledby="recent-title">
  <div class="section-heading">
    <p class="section-label" id="recent-title">Latest</p>
    <a href="{{ '/writing/' | relative_url }}">All notes</a>
  </div>
  <div class="post-list">
    {% for post in site.posts limit:3 %}
      <article class="post-row">
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d %b %Y" }}</time>
        <div>
          <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
          <p>{{ post.summary }}</p>
        </div>
        <span class="row-arrow" aria-hidden="true">↗</span>
      </article>
    {% endfor %}
  </div>
</section>
